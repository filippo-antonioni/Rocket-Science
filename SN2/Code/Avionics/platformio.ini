[platformio]
default_envs = banco

[env]
platform = espressif32@6.10.0
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 8MB
board_build.partitions = partitions_8mb.csv
board_build.filesystem = littlefs
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
lib_deps =
    adafruit/Adafruit BMP280 Library@2.6.8
    invensenseinc/ICM42670P@1.0.7
    adafruit/Adafruit NeoPixel@1.12.3
    madhephaestus/ESP32Servo@0.13.0
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DRGB_PIN=48

; Usare la presa USB-UART della scheda. Per la USB nativa vedere GUIDA.md.
; Nessuna dipendenza dalla PSRAM: il buffer usa SRAM interna.
[env:banco]
build_flags = ${env.build_flags} -DFIRMWARE_VOLO=0

[env:volo]
build_flags = ${env.build_flags} -DFIRMWARE_VOLO=1

; Solo dopo aver verificato la sigla N16R8 sul modulo e INFO flash_bytes.
[env:volo_16mb]
extends = env:volo
board_upload.flash_size = 16MB
board_build.partitions = partitions_16mb.csv
