[platformio]
default_envs = banco_psram

[env]
platform = espressif32@6.10.0
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 8MB
board_build.partitions = partitions_8mb.csv
board_build.filesystem = littlefs
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DBOARD_HAS_PSRAM
    -DRGB_PIN=48
lib_deps =
    adafruit/Adafruit BMP280 Library@2.6.8
    https://github.com/tdk-invn-oss/motion.arduino.ICM42670P.git#3a0f2a0
    adafruit/Adafruit NeoPixel@1.12.3
    madhephaestus/ESP32Servo@0.13.0

[env:banco_psram]
build_flags = ${env.build_flags} -DFIRMWARE_VOLO=0 -DBENCH_SERVO=0 -DMODE_SENSORI=0

[env:banco_servo_psram]
build_flags = ${env.build_flags} -DFIRMWARE_VOLO=0 -DBENCH_SERVO=1 -DMODE_SENSORI=0

[env:sensori_psram]
build_flags = ${env.build_flags} -DFIRMWARE_VOLO=0 -DBENCH_SERVO=0 -DMODE_SENSORI=1
