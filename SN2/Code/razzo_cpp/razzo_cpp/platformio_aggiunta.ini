; FRAMMENTO, non sostituisce il tuo platformio.ini.
; Aggiungere la riga sotto al lib_deps dell'ambiente ESP32 gia' funzionante.
; Conservare board, platform, framework, partizioni e librerie IMU/BMP esistenti.
; Usare una versione ESP32Servo compatibile col proprio Arduino-ESP32,
; preferibilmente la stessa con cui e' gia' stato compilato Gestione_fairing.ino.
;
; lib_deps =
;     ... le dipendenze gia' presenti ...
;     madhephaestus/ESP32Servo
;
; Il codice usa LittleFS: la tabella partizioni deve prevedere il filesystem.
; Nessun board ID e nessuna versione sono stati inventati in assenza del tuo .ini.
